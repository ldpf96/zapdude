[package]
name = "zapdude"
version = "1.1.0"
edition = "2021"
description = "Zapdude - WhatsApp Web multi-account desktop client with a local automation API for people and AI agents"
license = "AGPL-3.0-or-later"
authors = ["ldpf96"]



[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
ureq = "3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
url = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
serde_json = "1"
