<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Zapdude</title>
  <style>
    :root {
      --bg-top: #0d1f19;
      --bg-bottom: #08130f;
      --text: #eef4f1;
      --muted: #7d948a;
      --accent: #2ee06f;
    }
    :root[data-theme="light"] {
      --bg-top: #f3f8f5;
      --bg-bottom: #e7efeb;
      --text: #0c2118;
      --muted: #5d7568;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px;
    }
    .logo {
      width: 96px; height: 96px; border-radius: 27px;
      background: linear-gradient(140deg, #34e877 0%, #0f9e6c 100%);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 30px;
      box-shadow: 0 14px 50px rgba(46, 224, 111, 0.35), inset 0 2px 0 rgba(255,255,255,0.35);
    }
    .logo svg { width: 52px; height: 52px; }
    .logo svg path { fill: #06231a; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2)); }
    h1 { font-size: 27px; font-weight: 650; letter-spacing: 0.2px; margin-bottom: 10px; }
    p { color: var(--muted); font-size: 14.5px; line-height: 1.6; max-width: 460px; margin-bottom: 26px; }
    .choices { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .add {
      background: var(--accent); color: #06231a; border: none; border-radius: 26px;
      padding: 13px 30px; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: filter 0.15s, transform 0.12s; font-family: inherit;
      box-shadow: 0 6px 22px rgba(46,224,111,0.35);
      display: flex; align-items: center; gap: 10px;
    }
    .add:disabled { opacity: 0.5; cursor: wait; }
    .add svg { width: 18px; height: 18px; }
    .add svg path { fill: currentColor; }
    .add:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .add.fb {
      background: #1877f2; color: #ffffff;
      box-shadow: 0 6px 22px rgba(24,119,242,0.4);
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M13.2 2.2c.4-.5 1.2-.1 1.1.5l-1.1 6.6h5.1c.6 0 .9.7.5 1.1L10.8 21.8c-.4.5-1.2.1-1.1-.5l1.1-6.6H5.7c-.6 0-.9-.7-.5-1.1L13.2 2.2z"/>
    </svg>
  </div>
  <h1>Zapdude</h1>
  <p id="msg">All your chat accounts in one window, with a local API for AI agents.</p>
  <div class="choices">
    <button class="add" id="waBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
      </svg>
      WhatsApp
    </button>
    <button class="add fb" id="fbBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M.001 11.639C.001 4.949 5.241 0 12.001 0S24 4.95 24 11.639c0 6.689-5.24 11.638-12 11.638-1.21 0-2.38-.16-3.47-.46a.96.96 0 00-.64.05l-2.39 1.05a.96.96 0 01-1.35-.85l-.07-2.14a.97.97 0 00-.32-.68A11.39 11.389 0 01.002 11.64zm8.32-2.19l-3.52 5.6c-.35.53.32 1.139.82.75l3.79-2.87c.26-.2.6-.2.87 0l2.8 2.1c.84.63 2.04.4 2.6-.48l3.52-5.6c.35-.53-.32-1.13-.82-.75l-3.79 2.87c-.25.2-.6.2-.86 0l-2.8-2.1a1.8 1.8 0 00-2.61.48z"/>
      </svg>
      Messenger (Facebook)
    </button>
  </div>

  <script>
    "use strict";
    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    document.documentElement.dataset.theme = "dark";
    api("/api/prefs").then((prefs) => {
      document.documentElement.dataset.theme = prefs.theme === "light" ? "light" : "dark";
    }).catch(() => {});

    // Native-app feel: no browser context menu on the shell UI.
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    async function addAccount(service, btn) {
      btn.disabled = true;
      try {
        await api("/api/accounts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ service }),
        });
        btn.disabled = false;
      } catch (e) { console.error(e); btn.disabled = false; }
    }
    document.getElementById("waBtn").onclick = (ev) => addAccount("whatsapp", ev.currentTarget);
    document.getElementById("fbBtn").onclick = (ev) => addAccount("facebook", ev.currentTarget);
  </script>
</body>
</html>
