<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Zapdude</title>
  <style>
    :root {
      --bg-top: #0d1f19;
      --bg-bottom: #08130f;
      --text: #eef4f1;
      --muted: #7d948a;
      --accent: #2ee06f;
    }
    :root[data-theme="light"] {
      --bg-top: #f3f8f5;
      --bg-bottom: #e7efeb;
      --text: #0c2118;
      --muted: #5d7568;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px;
    }
    .logo {
      width: 96px; height: 96px; border-radius: 27px;
      background: linear-gradient(140deg, #34e877 0%, #0f9e6c 100%);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 30px;
      box-shadow: 0 14px 50px rgba(46, 224, 111, 0.35), inset 0 2px 0 rgba(255,255,255,0.35);
    }
    .logo svg { width: 52px; height: 52px; }
    .logo svg path { fill: #06231a; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2)); }
    h1 { font-size: 27px; font-weight: 650; letter-spacing: 0.2px; margin-bottom: 10px; }
    p { color: var(--muted); font-size: 14.5px; line-height: 1.6; max-width: 440px; margin-bottom: 26px; }
    .add {
      background: var(--accent); color: #06231a; border: none; border-radius: 26px;
      padding: 13px 34px; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: filter 0.15s, transform 0.12s; font-family: inherit;
      box-shadow: 0 6px 22px rgba(46,224,111,0.35);
    }
    .add:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .add:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M13.2 2.2c.4-.5 1.2-.1 1.1.5l-1.1 6.6h5.1c.6 0 .9.7.5 1.1L10.8 21.8c-.4.5-1.2.1-1.1-.5l1.1-6.6H5.7c-.6 0-.9-.7-.5-1.1L13.2 2.2z"/>
    </svg>
  </div>
  <h1>Zapdude</h1>
  <p id="msg">Todas tus cuentas de WhatsApp en una sola ventana, con una API local para agentes de IA.</p>
  <button class="add" id="addBtn">+ Agregar cuenta</button>

  <script>
    "use strict";
    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    document.documentElement.dataset.theme = "dark";
    api("/api/prefs").then((prefs) => {
      document.documentElement.dataset.theme = prefs.theme === "light" ? "light" : "dark";
    }).catch(() => {});

    // Native-app feel: no browser context menu on the shell UI.
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    document.getElementById("addBtn").onclick = async (ev) => {
      ev.currentTarget.disabled = true;
      try { await api("/api/accounts", { method: "POST" }); } catch (e) { console.error(e); }
      ev.currentTarget.disabled = false;
    };
  </script>
</body>
</html>
