<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Zapdude</title>
  <style>
    /* The "+" hover menu as a horizontal strip. This webview is born FULL
       content size (compositor law) and is immediately re-anchored by the
       host into the strip slot beside the rail's "+" tile. The body is
       transparent (WebviewBuilder::transparent(true)) so only the rounded
       card paints over the chat; ESC / mouse-leave close it, and the
       cursor presence is reported to the host (touch) so the rail's
       soft-close does not kill the menu while the cursor travels the
       4px gap between the + tile and this strip. */
    :root {
      --bg: #0f241c;
      --text: #eef4f1;
      --muted: #7d948a;
      --stroke: rgba(255, 255, 255, 0.10);
      --tile: rgba(255, 255, 255, 0.05);
      --tile-hover: rgba(255, 255, 255, 0.09);
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --text: #0c2118;
      --muted: #5d7568;
      --stroke: rgba(0, 0, 0, 0.10);
      --tile: rgba(0, 0, 0, 0.045);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      user-select: none;
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
    }
    /* The curved card, ANCHORED TO THE TOP of the strip slot: the slot is
       shorter than the birth-size view (the bottom 8px of the slot bleed
       outside the client area on purpose - centered math), so the card
       hugs the top edge to sit level with the + tile line. */
    .panel {
      position: absolute;
      left: 0; top: 0;
      display: flex; flex-direction: row; gap: 5px;
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--stroke);
      border-radius: 13px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.04);
      transform-origin: left top;
      animation: extend 0.15s ease-out;
    }
    :root[data-theme="light"] .panel { box-shadow: 0 10px 30px rgba(0,0,0,0.18); }
    @keyframes extend {
      from { opacity: 0; transform: translateX(-6px) scale(0.96); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    button.item {
      width: 56px; height: 56px; border-radius: 10px;
      background: var(--tile); border: 1px solid transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; cursor: pointer; padding: 0; font-family: inherit;
      transition: background 0.13s ease, transform 0.1s ease, border-color 0.13s ease;
    }
    button.item svg { width: 20px; height: 20px; color: #25d366; }
    button.item span { font-size: 8.5px; font-weight: 600; color: var(--muted); line-height: 1; }
    button.item:hover { background: var(--tile-hover); border-color: var(--stroke); transform: translateY(-1px); }
    button.item:active { transform: scale(0.96); }
    button.item:disabled { opacity: 0.5; cursor: wait; }
    button.item.fb svg { color: #00b2ff; }
  </style>
</head>
<body>
  <div class="panel">
    <button class="item" data-service="whatsapp">
      <svg><use href="#i-wa"/></svg>
      <span>WhatsApp</span>
    </button>
    <button class="item fb" data-service="facebook">
      <svg><use href="#i-fb"/></svg>
      <span>Messenger</span>
    </button>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-fb" viewBox="0 0 24 24">
        <!-- Messenger logo (simple-icons, CC0) -->
        <path fill="currentColor" d="M.001 11.639C.001 4.949 5.241 0 12.001 0S24 4.95 24 11.639c0 6.689-5.24 11.638-12 11.638-1.21 0-2.38-.16-3.47-.46a.96.96 0 00-.64.05l-2.39 1.05a.96.96 0 01-1.35-.85l-.07-2.14a.97.97 0 00-.32-.68A11.39 11.389 0 01.002 11.64zm8.32-2.19l-3.52 5.6c-.35.53.32 1.139.82.75l3.79-2.87c.26-.2.6-.2.87 0l2.8 2.1c.84.63 2.04.4 2.6-.48l3.52-5.6c.35-.53-.32-1.13-.82-.75l-3.79 2.87c-.25.2-.6.2-.86 0l-2.8-2.1a1.8 1.8 0 00-2.61.48z"/>
      </symbol>
      <symbol id="i-wa" viewBox="0 0 24 24">
        <!-- WhatsApp logo (simple-icons, CC0) -->
        <path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
      </symbol>
    </defs>
  </svg>

  <script>
    "use strict";
    async function hide() {
      try { await fetch("/api/ui/picker/hide", { method: "POST" }); } catch (e) {}
    }
    async function add(service, btn) {
      btn.disabled = true;
      try {
        await fetch("/api/accounts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ service: service }),
        });
        await hide();
      } catch (e) { btn.disabled = false; }
    }
    for (const item of document.querySelectorAll(".item")) {
      item.addEventListener("click", (ev) => add(item.dataset.service, ev.currentTarget));
    }
    // Theme follows the saved preference (one fetch at mount).
    fetch("/api/prefs")
      .then((r) => r.json())
      .then((p) => {
        document.documentElement.dataset.theme = p.theme === "light" ? "light" : "dark";
      })
      .catch(() => {});
    // Close-on-leave arms ONLY after a real cursor presence: the view is
    // born full-size and shrinks into the slot immediately, which
    // synthesizes a mouseleave whose timing raced a fixed grace window
    // (some mounts fired it past 700ms and the menu killed itself before
    // it was ever used). BIRTH-STATE = always closed-safe; a real
    // mouseenter arms dismissal and a later real mouseleave closes.
    var leaveArmed = false;
    document.addEventListener("mouseenter", () => {
      if (!leaveArmed) {
        leaveArmed = true;
      }
      fetch("/api/ui/picker/touch", { method: "POST" }).catch(() => {});
    });
    document.addEventListener("mouseleave", () => {
      if (!leaveArmed) {
        return; // synthetic (birth) leave - gotcha ignored
      }
      hide();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hide();
    });
  </script>
</body>
</html>
