<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ZapZap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, #0e211c 0%, #081511 100%);
      display: flex; flex-direction: column; align-items: center;
      padding: 14px 0 12px;
      overflow: hidden;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    .logo {
      width: 42px; height: 42px; border-radius: 13px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      display: flex; align-items: center; justify-content: center;
      font-size: 21px; margin-bottom: 20px; flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(37, 211, 102, 0.35);
    }
    .rail-scroll {
      flex: 1; overflow-y: auto; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 2px 0; scrollbar-width: none;
    }
    .rail-scroll::-webkit-scrollbar { display: none; }
    .avatar {
      width: 46px; height: 46px; border-radius: 50%;
      background: #182b26; color: #e9edef;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 600; cursor: pointer;
      position: relative; border: 2px solid transparent;
      transition: transform 0.12s ease, border-color 0.12s, background 0.12s;
      flex-shrink: 0;
    }
    .avatar:hover { background: #1f3831; transform: scale(1.07); }
    .avatar.active { border-color: #25d366; background: #143329; box-shadow: 0 0 12px rgba(37,211,102,0.35); }
    .avatar.armed {
      border-color: #ef5350; background: #3a1414; color: #ff8a80;
      box-shadow: 0 0 12px rgba(239, 83, 80, 0.5);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(1.12); } }
    .avatar .dot {
      position: absolute; right: -1px; bottom: -1px;
      width: 13px; height: 13px; border-radius: 50%;
      border: 2px solid #0b1a16; background: #6a7f78;
    }
    .dot.logged { background: #25d366; }
    .dot.qr { background: #f0b232; }
    .dot.detecting { background: #6a7f78; }
    .tooltip {
      position: absolute; left: 58px; top: 50%; transform: translateY(-50%);
      background: #1f2c33; color: #e9edef; font-size: 12px; font-weight: 500;
      padding: 6px 10px; border-radius: 8px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.12s;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45); z-index: 20;
    }
    .avatar:hover .tooltip, .icon-btn:hover .tooltip, .add-btn:hover .tooltip { opacity: 1; }
    .avatar.armed .tooltip { background: #4a1616; color: #ff8a80; opacity: 1; }
    .add-btn {
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(37, 211, 102, 0.10);
      border: 2px dashed rgba(37, 211, 102, 0.55);
      color: #25d366; font-size: 24px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, transform 0.12s;
      flex-shrink: 0; margin-top: 4px; position: relative;
      font-family: inherit;
    }
    .add-btn:hover { background: rgba(37, 211, 102, 0.22); transform: scale(1.07); }
    .add-btn:disabled { opacity: 0.5; cursor: wait; }
    .footer {
      display: flex; flex-direction: column; gap: 6px; align-items: center;
      padding-top: 12px; flex-shrink: 0;
    }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 11px; border: none;
      background: transparent; color: #7d938b; font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, color 0.12s; position: relative;
      font-family: inherit;
    }
    .icon-btn:hover { background: #182b26; color: #e9edef; }
    .version { font-size: 9px; color: #3d534b; margin-top: 4px; }
    .offline {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      background: #3a2a1a; color: #f0b232; font-size: 10px;
      padding: 3px 8px; border-radius: 6px; display: none; z-index: 30;
    }
  </style>
</head>
<body>
  <div class="offline" id="offline">Reconectando…</div>
  <div class="logo">⚡</div>
  <div class="rail-scroll" id="rail"></div>
  <button class="add-btn" id="addBtn" title="Agregar cuenta">+</button>
  <div class="footer">
    <button class="icon-btn" id="settingsBtn" title="Configuración API">
      ⚙<span class="tooltip">Configuración API</span>
    </button>
    <button class="icon-btn" id="aboutBtn" title="Acerca de">
      ⓘ<span class="tooltip">Acerca de ZapZap</span>
    </button>
    <div class="version" id="version">v1.0.0</div>
  </div>

  <script>
    "use strict";
    let armedId = null;
    let armedTimer = null;
    let wasOffline = false;

    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    function esc(s) {
      return String(s).replace(/[&<>\"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // Avatar letter: the account number when the label has one ("Cuenta 3"
    // shows "3"), otherwise the label's first letter.
    function badge(label) {
      const m = String(label || "").match(/(\d+)\s*$/);
      return m ? m[1] : String(label || "?").charAt(0).toUpperCase();
    }

    function disarm() {
      if (armedId) {
        armedId = null;
        clearTimeout(armedTimer);
        loadRail();
      }
    }

    // Self-heal: if the API goes away (port change / restart), show a badge
    // and reload this page as soon as the server answers again.
    async function healthWatch() {
      try {
        await api("/api/healthz");
        if (wasOffline) { location.reload(); }
        document.getElementById("offline").style.display = "none";
        wasOffline = false;
      } catch (_) {
        document.getElementById("offline").style.display = "block";
        wasOffline = true;
      }
      setTimeout(healthWatch, 2000);
    }

    async function loadRail() {
      let data;
      try { data = await api("/api/accounts"); }
      catch (e) { return; } // healthWatch handles reconnection UI
      const accounts = data.accounts || [];
      const rail = document.getElementById("rail");
      rail.innerHTML = "";
      for (const a of accounts) {
        const el = document.createElement("div");
        const isArmed = armedId === a.id;
        el.className = "avatar" + (a.active ? " active" : "") + (isArmed ? " armed" : "");
        const state = a.session_state === "logged_in" ? "logged" : a.session_state === "scan_qr" ? "qr" : "detecting";
        const stateLabel = a.session_state === "logged_in" ? "conectado" : a.session_state === "scan_qr" ? "espera QR" : "cargando";
        el.innerHTML = esc(isArmed ? "×" : badge(a.label)) +
          `<span class="dot ${state}"></span>` +
          `<span class="tooltip">${isArmed ? "Clic de nuevo para eliminar" : esc(a.label) + " · " + stateLabel}</span>`;
        el.onclick = async () => {
          if (armedId === a.id) {
            try { await api("/api/accounts/" + encodeURIComponent(a.id), { method: "DELETE" }); } catch (e) { console.error(e); }
            disarm();
            return;
          }
          if (armedId) { disarm(); return; }
          try { await api("/api/accounts/" + encodeURIComponent(a.id) + "/open", { method: "POST" }); } catch (e) { console.error(e); }
        };
        el.oncontextmenu = (ev) => {
          ev.preventDefault();
          if (armedId === a.id) { disarm(); return; }
          disarm();
          armedId = a.id;
          loadRail();
          armedTimer = setTimeout(disarm, 4000);
        };
        rail.appendChild(el);
      }
    }

    document.getElementById("addBtn").onclick = async (ev) => {
      disarm();
      const btn = ev.currentTarget;
      btn.disabled = true;
      try {
        await api("/api/accounts", { method: "POST" });
        await loadRail();
      } catch (e) { console.error(e); }
      btn.disabled = false;
    };
    document.getElementById("settingsBtn").onclick = () =>
      api("/api/ui/settings?tab=api", { method: "POST" }).catch(console.error);
    document.getElementById("aboutBtn").onclick = () =>
      api("/api/ui/settings?tab=about", { method: "POST" }).catch(console.error);

    document.addEventListener("keydown", (e) => { if (e.key === "Escape") disarm(); });

    (async () => {
      try {
        const h = await api("/api/healthz");
        document.getElementById("version").textContent = "v" + (h.version || "1.0.0");
      } catch (_) {}
      await loadRail();
      setInterval(loadRail, 4000);
      healthWatch();
    })();
  </script>
</body>
</html>
