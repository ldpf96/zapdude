<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Zapdude</title>
  <style>
    :root {
      --bg-top: #0d1f19;
      --bg-bottom: #08130f;
      --stroke: rgba(255, 255, 255, 0.07);
      --tile: rgba(255, 255, 255, 0.045);
      --tile-hover: rgba(255, 255, 255, 0.09);
      --accent: #2ee06f;
      --accent-soft: rgba(46, 224, 111, 0.14);
      --text: #eef4f1;
      --muted: #6b8279;
      --warn: #f5b83d;
      --danger: #ff5f56;
      --dot-border: #08130f;
    }
    :root[data-theme="light"] {
      --bg-top: #f3f8f5;
      --bg-bottom: #e7efeb;
      --stroke: rgba(0, 0, 0, 0.09);
      --tile: rgba(0, 0, 0, 0.05);
      --tile-hover: rgba(0, 0, 0, 0.09);
      --accent-soft: rgba(18, 140, 108, 0.12);
      --text: #0c2118;
      --muted: #5d7568;
      --dot-border: #e7efeb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      display: flex; flex-direction: column; align-items: center;
      padding: 16px 0;
      overflow: hidden;
      border-right: 1px solid var(--stroke);
    }
    svg.icon { width: 100%; height: 100%; display: block; }

    /* ---- Brand / logo (opens the full-screen options) ---- */
    .logo {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(140deg, #34e877 0%, #0f9e6c 100%);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer; position: relative;
      box-shadow:
        0 2px 10px rgba(46, 224, 111, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }
    .logo:hover { transform: translateY(-1px) scale(1.04); box-shadow: 0 4px 18px rgba(46,224,111,0.5), inset 0 1px 0 rgba(255,255,255,0.35); }
    .logo:active { transform: scale(0.97); }
    .logo svg { width: 22px; height: 22px; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25)); }
    .logo svg path { fill: #06231a; }
    .logo.open { box-shadow: 0 0 0 2px rgba(46,224,111,0.55), 0 4px 18px rgba(46,224,111,0.5), inset 0 1px 0 rgba(255,255,255,0.35); }

    /* ---- Delicate curved divider under the logo ---- */
    .divider {
      width: 44px; height: 3px; flex-shrink: 0; border: none;
      border-radius: 0 0 50% 50% / 0 0 100% 100%;
      background: linear-gradient(90deg, rgba(46,224,111,0) 0%, rgba(46,224,111,0.38) 50%, rgba(46,224,111,0) 100%);
      margin-top: 12px;
    }

    /* ---- Accounts scroll area: EVERY tile spaced uniformly (12px) ---- */
    .rail-scroll {
      flex: 1; overflow-y: auto; width: 100%;
      display: flex; flex-direction: column; align-items: center;
      gap: 12px;                       /* the only gap: accounts, + */
      padding: 12px 0 14px;
      scrollbar-width: none;
      mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 16px), transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 16px), transparent 100%);
    }
    .rail-scroll::-webkit-scrollbar { display: none; }
    #rail {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      width: 100%;
    }

    /* ---- Account tiles + the in-flow "+" ---- */
    .avatar, .add-btn {
      width: 44px; height: 44px; border-radius: 14px;
      background: var(--tile);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative;
      border: 1px solid transparent;
      transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
      flex-shrink: 0;
      font-family: inherit;
    }
    .avatar svg, .add-btn svg { width: 20px; height: 20px; opacity: 1; }
    .avatar:hover, .add-btn:hover { background: var(--tile-hover); transform: translateY(-1px); border-color: var(--stroke); }
    .avatar.active {
      background: var(--accent-soft);
      border-color: rgba(46, 224, 111, 0.55);
      box-shadow: 0 0 0 1px rgba(46,224,111,0.18), 0 2px 14px rgba(46,224,111,0.22);
    }
    .avatar.active svg { opacity: 1; color: var(--accent); }
    /* Service identity: each account wears its chat web's REAL logo and
     * brand color (WhatsApp green / Messenger blue; both simple-icons,
     * CC0). The Zapdude bolt stays only on the brand logo (top of rail). */
    .avatar.svc-wa svg { color: #25d366; }
    .avatar.svc-fb svg { color: #00b2ff; }
    .avatar.svc-fb.active svg { color: #33c0ff; }
    .avatar.armed {
      background: rgba(255, 95, 86, 0.16);
      border-color: rgba(255, 95, 86, 0.6);
      box-shadow: 0 0 0 1px rgba(255,95,86,0.25), 0 2px 14px rgba(255,95,86,0.3);
      animation: armed-pulse 0.9s ease-in-out infinite;
    }
    .avatar.armed svg { color: var(--danger); opacity: 1; }
    @keyframes armed-pulse { 50% { transform: scale(1.08); } }
    .avatar .dot {
      position: absolute; right: -2px; bottom: -2px;
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--dot-border);
      background: #5f7a70;
    }
    .dot.logged { background: var(--accent); }
    .dot.qr { background: var(--warn); }
    .dot.detecting { background: #5f7a70; }
    .dot.err { background: var(--danger); }

    .add-btn {
      background: var(--tile);
      border: 1.5px dashed rgba(46, 224, 111, 0.4);
      color: var(--accent);
    }
    .add-btn svg { width: 18px; height: 18px; }
    .add-btn:hover { background: var(--accent-soft); border-color: rgba(46,224,111,0.7); transform: translateY(-1px); }
    .add-btn:disabled { opacity: 0.45; cursor: wait; transform: none; }

    /* ---- "+" hover trigger ----
       The horizontal menu is a NEIGHBOR webview (the 76px rail viewport
       clips anything painted past its edge - proved live with an on-screen
       marker). Hovering the + opens the strip anchored beside the tile;
       see the host endpoints (window.rs) for the open/close choreography. */
    .add-wrap { position: relative; flex-shrink: 0; margin-bottom: 16px; }

    .tooltip {
      position: absolute; left: 58px; top: 50%; transform: translateY(-50%) translateX(-4px);
      background: rgba(16, 28, 24, 0.96); color: #eef4f1;
      font-size: 12px; font-weight: 500; letter-spacing: 0.1px;
      padding: 7px 11px; border-radius: 9px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.14s ease, transform 0.14s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
      z-index: 20;
    }
    :root[data-theme="light"] .tooltip { background: rgba(255,255,255,0.98); color: #0c2118; box-shadow: 0 8px 24px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.08); }
    .avatar:hover .tooltip, .logo:hover .tooltip, .add-btn:hover .tooltip {
      opacity: 1; transform: translateY(-50%) translateX(0);
    }
    .avatar.armed .tooltip { background: rgba(60, 18, 16, 0.97); color: #ffb4ae; opacity: 1; transform: translateY(-50%) translateX(0); }

    /* ---- "More accounts below" indicator ---- */
    .more-indicator {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 26px; height: 18px; border-radius: 9px;
      background: var(--tile-hover); color: var(--muted);
      display: none; align-items: center; justify-content: center;
      pointer-events: none; z-index: 15;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      animation: more-bounce 1.6s ease-in-out infinite;
    }
    .more-indicator.show { display: flex; }
    .more-indicator svg { width: 12px; height: 12px; }
    @keyframes more-bounce { 50% { transform: translateX(-50%) translateY(2px); } }

    .offline {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(80, 56, 18, 0.95); color: var(--warn); font-size: 10.5px; font-weight: 600;
      padding: 4px 10px; border-radius: 7px; display: none; z-index: 30;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <!-- Icon library -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-bolt" viewBox="0 0 24 24">
        <path fill="currentColor" d="M13.2 2.2c.4-.5 1.2-.1 1.1.5l-1.1 6.6h5.1c.6 0 .9.7.5 1.1L10.8 21.8c-.4.5-1.2.1-1.1-.5l1.1-6.6H5.7c-.6 0-.9-.7-.5-1.1L13.2 2.2z"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 5v14M5 12h14"/>
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
      </symbol>
      <symbol id="i-chevdown" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/>
      </symbol>
      <symbol id="i-fb" viewBox="0 0 24 24">
        <!-- Messenger logo (simple-icons, CC0) -->
        <path fill="currentColor" d="M.001 11.639C.001 4.949 5.241 0 12.001 0S24 4.95 24 11.639c0 6.689-5.24 11.638-12 11.638-1.21 0-2.38-.16-3.47-.46a.96.96 0 00-.64.05l-2.39 1.05a.96.96 0 01-1.35-.85l-.07-2.14a.97.97 0 00-.32-.68A11.39 11.389 0 01.002 11.64zm8.32-2.19l-3.52 5.6c-.35.53.32 1.139.82.75l3.79-2.87c.26-.2.6-.2.87 0l2.8 2.1c.84.63 2.04.4 2.6-.48l3.52-5.6c.35-.53-.32-1.13-.82-.75l-3.79 2.87c-.25.2-.6.2-.86 0l-2.8-2.1a1.8 1.8 0 00-2.61.48z"/>
      </symbol>
      <symbol id="i-wa" viewBox="0 0 24 24">
        <!-- WhatsApp logo (simple-icons, CC0) -->
        <path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
      </symbol>
    </defs>
  </svg>

  <div class="offline" id="offline">Reconnecting...</div>

  <div class="logo" id="logo">
    <svg class="icon"><use href="#i-bolt"/></svg>
    <span class="tooltip">Zapdude options</span>
  </div>

  <div class="divider" aria-hidden="true"></div>

  <div class="rail-scroll" id="scroll">
    <div id="rail"></div>
  </div>

  <!-- The "+" lives OUTSIDE the scroll area so it is PINNED near the rail's
       bottom edge (a 14px air gap keeps it from hugging the frame - the
       user's aesthetic note; the strip slot in window.rs moves with it). -->
  <div class="add-wrap" id="addWrap">
    <button class="add-btn" id="addBtn">
      <svg class="icon"><use href="#i-plus"/></svg>
      <span class="tooltip">Add account</span>
    </button>
  </div>

  <div class="more-indicator" id="more">
    <svg><use href="#i-chevdown"/></svg>
  </div>

  <script>
    "use strict";
    let armedId = null;
    let accounts = [];
    let activeId = null;
    let wasOffline = false;

    const scroll = document.getElementById("scroll");
    const addBtn = document.getElementById("addBtn");
    const rail = document.getElementById("rail");

    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    // Self-heal: if the API goes away (port change / restart), show a badge
    // and reload this page as soon as the server answers again.
    async function healthWatch() {
      try {
        await api("/api/healthz");
        if (wasOffline) { location.reload(); }
        document.getElementById("offline").style.display = "none";
        wasOffline = false;
      } catch (_) {
        document.getElementById("offline").style.display = "block";
        wasOffline = true;
      }
      setTimeout(healthWatch, 2000);
    }

    async function loadRail() {
      let data;
      try { data = await api("/api/accounts"); }
      catch (e) { return; } // healthWatch handles reconnection UI
      accounts = data.accounts || [];
      renderRail();
      updateMoreIndicator();
    }

    // Theme follows the saved preference (checked on every poll, cheap).
    async function loadTheme() {
      try {
        const prefs = await api("/api/prefs");
        document.documentElement.dataset.theme = prefs.theme === "light" ? "light" : "dark";
      } catch (_) { /* keep current */ }
    }

    function disarm() {
      if (armedId) { armedId = null; renderRail(); }
    }

    // Incremental DOM update (no innerHTML rebuild = no flicker on polls).
    function serviceGlyph(a) {
      return a.service === "facebook" ? "#i-fb" : "#i-wa";
    }
    function serviceLabel(a) {
      return a.service === "facebook" ? "Facebook" : "WhatsApp";
    }
    function serviceName(a) {
      return a.service === "facebook" ? "Facebook chat" : "WhatsApp";
    }
    function renderRail() {
      const byId = new Map();
      for (const a of accounts) {
        if (a.active) activeId = a.id;
        byId.set(a.id, a);
      }
      // Remove stale tiles.
      for (const el of Array.from(rail.children)) {
        if (!byId.has(el.dataset.id)) el.remove();
      }
      // Update/create tiles in order.
      accounts.forEach((a, index) => {
        let el = rail.children[index];
        const isArmed = armedId === a.id;
        // Honest dot semantics (the user's spec): green = connected,
        // yellow = the account needs the human (QR / sign in), red = a
        // real page problem, grey = unknown / starting / offline-ish.
        // The dot used to ROTATE green/grey on every poll: the session
        // cache expired after 2.5s and the UI fell back to "detecting"
        // until the refresh landed - fixed host-side (stale-while-
        // revalidate), the dot now keeps the last honest color.
        const state =
          a.session_state === "logged_in" ? "logged"
          : (a.session_state === "scan_qr" || a.session_state === "needs_login") ? "qr"
          : a.session_state === "page_error" ? "err"
          : "detecting";
        const stateLabel =
          a.session_state === "logged_in" ? "connected"
          : a.session_state === "scan_qr" ? "waiting for QR"
          : a.session_state === "needs_login" ? "waiting for sign in"
          : a.session_state === "page_error" ? "connection problem"
          : "loading";
        if (!el || el.dataset.id !== a.id) {
          el = document.createElement("div");
          el.dataset.id = a.id;
          el.innerHTML = `<svg class="icon"><use href="#i-wa"/></svg>` +
            `<span class="dot"></span>` +
            `<span class="tooltip"></span>`;
          el.onclick = async () => {
            if (armedId === a.id) {
              try { await api("/api/accounts/" + encodeURIComponent(a.id), { method: "DELETE" }); } catch (e) { console.error(e); }
              armedId = null;
              loadRail();
              return;
            }
            if (armedId) { disarm(); return; }
            try { await api("/api/accounts/" + encodeURIComponent(a.id) + "/open", { method: "POST" }); } catch (e) { console.error(e); }
          };
          el.oncontextmenu = (ev) => {
            ev.preventDefault();
            if (armedId === a.id) { disarm(); return; }
            armedId = a.id;
            renderRail();
          };
          rail.insertBefore(el, rail.children[index] || null);
        }
        el.className = "avatar svc-" + (a.service === "facebook" ? "fb" : "wa") +
          (a.active ? " active" : "") + (isArmed ? " armed" : "");
        el.querySelector("use").setAttribute("href", isArmed ? "#i-x" : serviceGlyph(a));
        el.querySelector(".dot").className = "dot " + state;
        const tip = el.querySelector(".tooltip");
        tip.textContent = isArmed ? "Click again to delete" : `${a.label} - ${serviceName(a)} - ${stateLabel}`;
      });
    }

    // Little "more below" cue when the rail overflows.
    function updateMoreIndicator() {
      const more = document.getElementById("more");
      const remaining = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight;
      more.classList.toggle("show", remaining > 24);
    }
    scroll.addEventListener("scroll", updateMoreIndicator, { passive: true });
    window.addEventListener("resize", updateMoreIndicator);

    // Logo click: toggle the full-screen options (API / AI agent / About).
    document.getElementById("logo").onclick = async (ev) => {
      disarm();
      try { await api("/api/ui/drawer", { method: "POST" }); } catch (e) { console.error(e); }
    };

    // "+" trigger = CLICK (the user's preference over hover-opening).
    // The strip opens anchored beside the + tile (host-side, drawer-style
    // webview born full-size then slotted). Dismissal: clicking + again
    // (toggle), a rail click outside the wrapper, Esc, picking a service,
    // leaving the strip itself, or the soft-close when the cursor exits
    // the + WITHOUT entering the strip (the strip's touch pings cancel
    // it, so a 4px system gap never kills the menu mid-travel).
    const addWrap = document.getElementById("addWrap");
    addBtn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      disarm();
      api("/api/ui/picker/toggle", { method: "POST" }).catch(() => {});
    });
    addWrap.addEventListener("mouseleave", () => {
      api("/api/ui/picker/soft-close", { method: "POST" }).catch(() => {});
    });
    document.addEventListener("click", (ev) => {
      if (!addWrap.contains(ev.target)) {
        api("/api/ui/picker/hide", { method: "POST" }).catch(() => {});
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        api("/api/ui/picker/hide", { method: "POST" }).catch(() => {});
      }
    });

    document.addEventListener("keydown", (e) => { if (e.key === "Escape") disarm(); });

    // Native-app feel: no browser context menu on the shell UI.
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    (async () => {
      await loadRail();
      await loadTheme();
      setInterval(loadRail, 2500);
      setInterval(loadTheme, 10000);
      healthWatch();
    })();
  </script>
</body>
</html>
