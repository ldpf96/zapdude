<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Zapdude</title>
  <style>
    :root {
      --bg-top: #0d1f19;
      --bg-bottom: #08130f;
      --stroke: rgba(255, 255, 255, 0.07);
      --tile: rgba(255, 255, 255, 0.045);
      --tile-hover: rgba(255, 255, 255, 0.09);
      --accent: #2ee06f;
      --accent-soft: rgba(46, 224, 111, 0.14);
      --text: #eef4f1;
      --muted: #6b8279;
      --warn: #f5b83d;
      --danger: #ff5f56;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      display: flex; flex-direction: column; align-items: center;
      padding: 16px 0 16px;
      overflow: hidden;
      border-right: 1px solid var(--stroke);
    }
    svg.icon { width: 100%; height: 100%; display: block; }

    /* ---- Brand / logo (opens the options drawer) ---- */
    .logo {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(140deg, #34e877 0%, #0f9e6c 100%);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer; position: relative;
      box-shadow:
        0 2px 10px rgba(46, 224, 111, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }
    .logo:hover { transform: translateY(-1px) scale(1.04); box-shadow: 0 4px 18px rgba(46,224,111,0.5), inset 0 1px 0 rgba(255,255,255,0.35); }
    .logo:active { transform: scale(0.97); }
    .logo svg { width: 22px; height: 22px; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25)); }
    .logo.open { box-shadow: 0 0 0 2px rgba(46,224,111,0.55), 0 4px 18px rgba(46,224,111,0.5), inset 0 1px 0 rgba(255,255,255,0.35); }

    /* ---- Delicate curved dividers (purely aesthetic) ---- */
    .divider {
      width: 44px; height: 3px; flex-shrink: 0; border: none; border-radius: 0 0 50% 50% / 0 0 100% 100%;
      background: linear-gradient(90deg, rgba(46,224,111,0) 0%, rgba(46,224,111,0.38) 50%, rgba(46,224,111,0) 100%);
    }
    .divider.below { margin-top: 10px; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
    .divider.above { margin-bottom: 12px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }

    .rail-scroll {
      flex: 1; overflow-y: auto; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 18px 0 10px; scrollbar-width: none;
      mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    }
    .rail-scroll::-webkit-scrollbar { display: none; }

    /* ---- Account tiles ---- */
    .avatar {
      width: 44px; height: 44px; border-radius: 14px;
      background: var(--tile);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative;
      border: 1px solid transparent;
      transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
      flex-shrink: 0;
    }
    .avatar svg { width: 20px; height: 20px; opacity: 0.85; }
    .avatar:hover { background: var(--tile-hover); transform: translateY(-1px); border-color: var(--stroke); }
    .avatar.active {
      background: var(--accent-soft);
      border-color: rgba(46, 224, 111, 0.55);
      box-shadow: 0 0 0 1px rgba(46,224,111,0.18), 0 2px 14px rgba(46,224,111,0.22);
    }
    .avatar.active svg { opacity: 1; color: var(--accent); }
    .avatar.armed {
      background: rgba(255, 95, 86, 0.16);
      border-color: rgba(255, 95, 86, 0.6);
      box-shadow: 0 0 0 1px rgba(255,95,86,0.25), 0 2px 14px rgba(255,95,86,0.3);
      animation: armed-pulse 0.9s ease-in-out infinite;
    }
    .avatar.armed svg { color: var(--danger); opacity: 1; }
    @keyframes armed-pulse { 50% { transform: scale(1.08); } }
    .avatar .dot {
      position: absolute; right: -2px; bottom: -2px;
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--bg-bottom);
      background: #5f7a70;
    }
    .dot.logged { background: var(--accent); }
    .dot.qr { background: var(--warn); }
    .dot.detecting { background: #5f7a70; }

    .tooltip {
      position: absolute; left: 58px; top: 50%; transform: translateY(-50%) translateX(-4px);
      background: rgba(16, 28, 24, 0.96); color: var(--text);
      font-size: 12px; font-weight: 500; letter-spacing: 0.1px;
      padding: 7px 11px; border-radius: 9px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.14s ease, transform 0.14s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
      z-index: 20;
    }
    .avatar:hover .tooltip, .logo:hover .tooltip, .add-btn:hover .tooltip {
      opacity: 1; transform: translateY(-50%) translateX(0);
    }
    .avatar.armed .tooltip { background: rgba(60, 18, 16, 0.97); color: #ffb4ae; opacity: 1; transform: translateY(-50%) translateX(0); }

    /* ---- Add account ---- */
    .add-btn {
      width: 44px; height: 44px; border-radius: 14px;
      background: var(--tile);
      border: 1.5px dashed rgba(46, 224, 111, 0.4);
      color: var(--accent);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.14s ease, transform 0.14s ease, border-color 0.14s ease;
      flex-shrink: 0; position: relative;
    }
    .add-btn svg { width: 18px; height: 18px; }
    .add-btn:hover { background: var(--accent-soft); border-color: rgba(46,224,111,0.7); transform: translateY(-1px); }
    .add-btn:disabled { opacity: 0.45; cursor: wait; transform: none; }

    .offline {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(80, 56, 18, 0.95); color: var(--warn); font-size: 10.5px; font-weight: 600;
      padding: 4px 10px; border-radius: 7px; display: none; z-index: 30;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <!-- Icon library -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-bolt" viewBox="0 0 24 24">
        <path fill="currentColor" d="M13.2 2.2c.4-.5 1.2-.1 1.1.5l-1.1 6.6h5.1c.6 0 .9.7.5 1.1L10.8 21.8c-.4.5-1.2.1-1.1-.5l1.1-6.6H5.7c-.6 0-.9-.7-.5-1.1L13.2 2.2z"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 5v14M5 12h14"/>
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
      </symbol>
    </defs>
  </svg>

  <div class="offline" id="offline">Reconectando…</div>

  <div class="logo" id="logo">
    <svg class="icon"><use href="#i-bolt"/></svg>
    <span class="tooltip">Opciones Zapdude</span>
  </div>

  <div class="divider below" aria-hidden="true"></div>

  <div class="rail-scroll" id="rail"></div>

  <div class="divider above" aria-hidden="true"></div>

  <button class="add-btn" id="addBtn">
    <svg class="icon"><use href="#i-plus"/></svg>
    <span class="tooltip">Agregar cuenta</span>
  </button>

  <script>
    "use strict";
    let armedId = null;
    let accounts = [];
    let activeId = null;
    let wasOffline = false;

    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    function esc(s) {
      return String(s).replace(/[&<>\"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function disarm() {
      if (armedId) { armedId = null; renderRail(); }
    }

    // Self-heal: if the API goes away (port change / restart), show a badge
    // and reload this page as soon as the server answers again.
    async function healthWatch() {
      try {
        await api("/api/healthz");
        if (wasOffline) { location.reload(); }
        document.getElementById("offline").style.display = "none";
        wasOffline = false;
      } catch (_) {
        document.getElementById("offline").style.display = "block";
        wasOffline = true;
      }
      setTimeout(healthWatch, 2000);
    }

    async function loadRail() {
      let data;
      try { data = await api("/api/accounts"); }
      catch (e) { return; } // healthWatch handles reconnection UI
      accounts = data.accounts || [];
      renderRail();
    }

    // Incremental DOM update (no innerHTML rebuild = no flicker on polls).
    function renderRail() {
      const rail = document.getElementById("rail");
      const byId = new Map();
      for (const a of accounts) {
        if (a.active) activeId = a.id;
        byId.set(a.id, a);
      }
      // Remove stale tiles.
      for (const el of Array.from(rail.children)) {
        if (!byId.has(el.dataset.id)) el.remove();
      }
      // Update/create tiles in order.
      accounts.forEach((a, index) => {
        let el = rail.children[index];
        const isArmed = armedId === a.id;
        const state = a.session_state === "logged_in" ? "logged" : a.session_state === "scan_qr" ? "qr" : "detecting";
        const stateLabel = a.session_state === "logged_in" ? "conectada" : a.session_state === "scan_qr" ? "esperando QR" : "cargando";
        if (!el || el.dataset.id !== a.id) {
          el = document.createElement("div");
          el.dataset.id = a.id;
          el.innerHTML = `<svg class="icon"><use href="#i-bolt"/></svg>` +
            `<span class="dot"></span>` +
            `<span class="tooltip"></span>`;
          el.onclick = async () => {
            if (armedId === a.id) {
              try { await api("/api/accounts/" + encodeURIComponent(a.id), { method: "DELETE" }); } catch (e) { console.error(e); }
              armedId = null;
              loadRail();
              return;
            }
            if (armedId) { disarm(); return; }
            try { await api("/api/accounts/" + encodeURIComponent(a.id) + "/open", { method: "POST" }); } catch (e) { console.error(e); }
          };
          el.oncontextmenu = (ev) => {
            ev.preventDefault();
            if (armedId === a.id) { disarm(); return; }
            armedId = a.id;
            renderRail();
          };
          rail.insertBefore(el, rail.children[index] || null);
        }
        el.className = "avatar" + (a.active ? " active" : "") + (isArmed ? " armed" : "");
        el.querySelector("use").setAttribute("href", isArmed ? "#i-x" : "#i-bolt");
        el.querySelector(".dot").className = "dot " + state;
        const tip = el.querySelector(".tooltip");
        tip.textContent = isArmed ? "Clic de nuevo para eliminar" : `${a.label} · ${stateLabel}`;
      });
    }

    // Logo click: toggle the options drawer (API / AI agent / About).
    document.getElementById("logo").onclick = async (ev) => {
      disarm();
      try { await api("/api/ui/drawer", { method: "POST" }); } catch (e) { console.error(e); }
    };

    document.getElementById("addBtn").onclick = async (ev) => {
      disarm();
      const btn = ev.currentTarget;
      btn.disabled = true;
      try {
        await api("/api/accounts", { method: "POST" });
        await loadRail();
      } catch (e) { console.error(e); }
      btn.disabled = false;
    };

    document.addEventListener("keydown", (e) => { if (e.key === "Escape") disarm(); });

    // Native-app feel: no browser context menu on the shell UI.
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    (async () => {
      await loadRail();
      setInterval(loadRail, 2500);
      healthWatch();
    })();
  </script>
</body>
</html>
